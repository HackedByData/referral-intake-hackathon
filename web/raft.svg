<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Raft logo: a person on a raft looking out at the horizon">
  <title>Raft</title>
  <defs>
    <clipPath id="raft-badge"><circle cx="32" cy="32" r="31"/></clipPath>
  </defs>
  <g clip-path="url(#raft-badge)">
    <!-- sky and a sun sitting on the horizon -->
    <rect width="64" height="64" fill="#dcecf3"/>
    <circle cx="47" cy="37" r="8" fill="#f2b705"/>
    <!-- sea -->
    <rect y="37" width="64" height="27" fill="#0a5c78"/>
    <path d="M6 54c3-2 6-2 9 0s6 2 9 0M40 57c3-2 6-2 9 0s6 2 9 0" fill="none" stroke="#5f9fb5" stroke-width="1.6" stroke-linecap="round"/>
    <!-- raft: four lashed logs -->
    <rect x="9" y="44" width="30" height="6" rx="3" fill="#b07a44"/>
    <path d="M16.5 44v6M24 44v6M31.5 44v6" stroke="#7d5229" stroke-width="1.4"/>
    <path d="M12 47h24" stroke="#7d5229" stroke-width="1" stroke-dasharray="1.5 2.5"/>
    <!-- a person standing, hand shading their eyes, facing the horizon -->
    <circle cx="22" cy="25.5" r="3.2" fill="#17212b"/>
    <path d="M22 29.5v8.5M22 38l-3 6M22 38l3 6" fill="none" stroke="#17212b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 31.5l5.5-1.5-2.5-5.2" fill="none" stroke="#17212b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M23 23.6h4.6" stroke="#17212b" stroke-width="2" stroke-linecap="round"/>
    <path d="M22 31.5l-3 5" fill="none" stroke="#17212b" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <circle cx="32" cy="32" r="31" fill="none" stroke="#ffffff" stroke-width="2"/>
</svg>
